<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Reward Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 50px 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #ccc;
        }
        #message {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
        .coupon-box {
            margin-top: 15px;
            padding: 10px;
            background-color: #e9ecef;
            border: 2px dashed #28a745;
            display: none;
            font-size: 18px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Daily Quiz</h2>
        
        <p id="questionText">Loading today's question...</p>
        
        <input type="text" id="answerInput" placeholder="Type your answer here...">
        <br>
        <button id="submitBtn" onclick="submitAnswer()">Submit Answer</button>
        
        <p id="message"></p>
        <div id="couponBox" class="coupon-box"></div>
    </div>

    <script>
        // Your live Google Apps Script URL
        const API_URL = "https://script.google.com/macros/s/AKfycby10zZc4DrVexl1rPW6Gh-iSyVboTxM3T02H5p1tkpLV8XBHAZjOQGYFMviO9dHp0Xbbg/exec";

        // Fetch today's question from Google Sheets when the page loads
        window.onload = function() {
            const questionEl = document.getElementById('questionText');
            
            fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    if(data.question) {
                        questionEl.innerText = data.question;
                    }
                })
                .catch(error => {
                    questionEl.innerText = "Error loading question. Please refresh.";
                });
        };

        // Generate or retrieve the User ID from local storage
        function getOrGenerateUserId() {
            let userId = localStorage.getItem('daily_quiz_user_id');
            if (!userId) {
                userId = 'user_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
                localStorage.setItem('daily_quiz_user_id', userId);
            }
            return userId;
        }

        // Send the user's answer to Google Sheets to check if it's correct
        function submitAnswer() {
            const answer = document.getElementById('answerInput').value;
            const messageEl = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');
            const couponBox = document.getElementById('couponBox');
            const userId = getOrGenerateUserId();

            if (answer.trim() === "") {
                messageEl.innerText = "Please enter an answer first!";
                messageEl.style.color = "red";
                return;
            }

            // Lock the button so they don't click it twice
            submitBtn.disabled = true;
            messageEl.style.color = "black";
            messageEl.innerText = "Checking your answer...";
            couponBox.style.display = "none";

            // Send the data via POST
            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ userId: userId, answer: answer })
            })
            .then(response => response.json())
            .then(data => {
                submitBtn.disabled = false; // Unlock button
                
                if (data.success) {
                    messageEl.innerText = "🎉 " + data.message;
                    messageEl.style.color = "green";
                    couponBox.innerText = data.couponCode;
                    couponBox.style.display = "block";
                } else {
                    messageEl.innerText = "❌ " + data.message;
                    messageEl.style.color = "red";
                }
            })
            .catch(error => {
                submitBtn.disabled = false;
                messageEl.innerText = "Something went wrong. Please try again.";
                messageEl.style.color = "red";
            });
        }
    </script>
</body>
</html>
